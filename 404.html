<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="robots" content="noindex">
<title>Page not found · Friendly Pay</title>
<base href="/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,system-ui,sans-serif;color:#000;background:#F2F2F7}
html[dir=rtl] body{font-family:"SF Arabic","Geeza Pro","Noto Sans Arabic",system-ui,sans-serif}
main{width:100%;max-width:380px;text-align:center}
.mk{display:block;margin:0 auto 22px;border-radius:22%;filter:drop-shadow(0 14px 24px rgba(0,80,70,.3))}
h1{margin:0 0 8px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px}
p{margin:0 0 26px;color:rgba(60,60,67,.76)}
.code{display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:rgba(0,122,111,.12);color:#007A6F;font-weight:600;font-size:13px;letter-spacing:.02em}
a.b,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:999px;background:#007A6F;color:#fff;font:inherit;font-weight:600;font-size:17px;text-decoration:none;cursor:pointer}
a.b:active,button:active{transform:scale(.98)}
a.s{display:block;margin-top:12px;min-height:44px;line-height:44px;color:#007A6F;font-weight:400;font-size:17px;text-decoration:none}
@media (prefers-color-scheme:dark){body{color:#fff;background:#000}p{color:rgba(235,235,245,.62)}.code{background:rgba(50,212,192,.16);color:#32D4C0}a.b,button{background:#32D4C0;color:#00201D}a.s{color:#32D4C0}}
@media (prefers-reduced-motion:no-preference){main{animation:in .5s cubic-bezier(.2,.9,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(14px)}}}</style>
</head>
<body>
<main role="main">
<svg class="mk" viewBox="0 0 512 512" width="88" height="88" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3CE0CC"/><stop offset=".5" stop-color="#079A8D"/><stop offset="1" stop-color="#00655B"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#g)"/><g transform="translate(-23 -4)" fill="none" stroke="#fff" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"><path d="M190 386V200a66 66 0 0 1 66-66H368"/><path d="M190 264H322"/></g><circle cx="321" cy="368" r="36" fill="#FFC24B"/></svg>
<span class="code">404</span>
<h1 id="t">Page not found</h1>
<p id="p">This page does not exist or has moved. Your account is safe.</p>
<a class="b" id="b" href="/">Back to Friendly Pay</a>
</main>
<script>
var T={
en:{t:'Page not found',p:'This page does not exist or has moved. Your account is safe.',b:'Back to Friendly Pay',s:''},
fr:{t:'Page introuvable',p:'Cette page n\'existe pas ou a été déplacée. Votre compte est en sécurité.',b:'Retour à Friendly Pay',s:''},
ar:{t:'الصفحة غير موجودة',p:'هذه الصفحة غير موجودة أو تم نقلها. حسابك بأمان.',b:'العودة إلى فرندي باي',s:''}};
(function(){var l='en';try{var L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
 for(var i=0;i<L.length;i++){var c=String(L[i]).toLowerCase().slice(0,2);if(T[c]){l=c;break}}
 var st=localStorage.getItem('yor_device_lang');if(T[st])l=st;}catch(e){}
 var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';var x=T[l];
 document.title=x.t+' · '+(l==='ar'?'فرندي باي':'Friendly Pay');
 document.getElementById('t').textContent=x.t;document.getElementById('p').textContent=x.p;
 var b=document.getElementById('b');b.textContent=x.b;var s=document.getElementById('s');if(s)s.textContent=x.s;
})();
</script>
</body>
</html>
