<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>You're offline · Friendly Pay</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,system-ui,sans-serif;color:#000;background:#FFFFFF}
html[dir=rtl] body{font-family:"SF Arabic","Geeza Pro","Noto Sans Arabic",system-ui,sans-serif}
main{width:100%;max-width:380px;text-align:center}
.mk{display:block;margin:0 auto 22px;border-radius:22%;filter:drop-shadow(0 14px 24px rgba(47,61,219,.3))}
h1{margin:0 0 8px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px}
p{margin:0 0 26px;color:rgba(60,60,67,.76)}
.code{display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:rgba(59,73,232,.12);color:#3B49E8;font-weight:600;font-size:13px;letter-spacing:.02em}
a.b,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:999px;background:#3B49E8;color:#fff;font:inherit;font-weight:600;font-size:17px;text-decoration:none;cursor:pointer}
a.b:active,button:active{transform:scale(.98)}
a.s{display:block;margin-top:12px;min-height:44px;line-height:44px;color:#3B49E8;font-weight:400;font-size:17px;text-decoration:none}
@media (prefers-color-scheme:dark){body{color:#fff;background:#000}p{color:rgba(235,235,245,.62)}.code{background:rgba(154,164,255,.16);color:#9AA4FF}a.b,button{background:#9AA4FF;color:#0A0F3D}a.s{color:#9AA4FF}}
@media (prefers-reduced-motion:no-preference){main{animation:in .5s cubic-bezier(.2,.9,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(14px)}}}</style>
</head>
<body>
<main role="main">
<svg class="mk" viewBox="0 0 512 512" width="88" height="88" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6372FF"/><stop offset="1" stop-color="#2A33C9"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE59A"/><stop offset="1" stop-color="#FFAE2B"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#g)"/><path d="M150 300Q256 410 362 300" fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="176" r="58" fill="url(#c)"/></svg>
<h1 id="t">You're offline</h1>
<p id="p">Friendly Pay needs an internet connection to show your money. Check your connection, then try again.</p>
<button type="button" id="b">Try again</button>
</main>
<script>
var T={
en:{t:'You\'re offline',p:'Friendly Pay needs an internet connection to show your money. Check your connection, then try again.',b:'Try again',s:''},
fr:{t:'Vous êtes hors ligne',p:'Friendly Pay a besoin d\'internet pour afficher votre argent. Vérifiez votre connexion, puis réessayez.',b:'Réessayer',s:''},
ar:{t:'أنت غير متصل بالإنترنت',p:'يحتاج فرندي باي إلى الإنترنت لعرض أموالك. تحقّق من اتصالك ثم أعد المحاولة.',b:'إعادة المحاولة',s:''}};
(function(){var l='en';try{var L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
 for(var i=0;i<L.length;i++){var c=String(L[i]).toLowerCase().slice(0,2);if(T[c]){l=c;break}}
 var st=localStorage.getItem('yor_device_lang');if(T[st])l=st;}catch(e){}
 var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';var x=T[l];
 document.title=x.t+' · '+(l==='ar'?'فرندي باي':'Friendly Pay');
 document.getElementById('t').textContent=x.t;document.getElementById('p').textContent=x.p;
 var b=document.getElementById('b');b.textContent=x.b;var s=document.getElementById('s');if(s)s.textContent=x.s;
})();
document.getElementById('b').onclick=function(){location.reload()};
window.addEventListener('online',function(){location.reload()});
</script>
</body>
</html>
